<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thư viện hướng dẫn y khoa tiếng Việt, được sắp xếp theo chuyên khoa và dễ tra cứu.">
  <meta name="theme-color" content="#0d5c63">
  <title>Thư viện Hướng dẫn Y khoa</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="styles.css?v=20260923-1">
</head>
<body>
  <a class="skip-link" href="#main">Chuyển đến nội dung chính</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Về trang chủ">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span><strong>MEDGUIDE</strong><small>Thư viện hướng dẫn y khoa</small></span>
    </a>
    <button class="icon-button" id="themeButton" type="button" aria-label="Đổi giao diện sáng tối">◐</button>
  </header>

  <div class="app-shell">
    <main id="main" tabindex="-1">
      <section class="home-view" id="homeView">
        <div class="hero">
          <div>
            <p class="eyebrow">TRA CỨU NHANH · ĐỌC DỄ DÀNG</p>
            <h1>Góc học tập<br><span>của Dr.Gấu.</span></h1>
            <a class="latest-link" id="latestArticle" href="content/roi-loan-chuc-nang-tien-dinh.html">Bài mới: Rối loạn chức năng tiền đình — chẩn đoán và điều trị →</a>
          </div>
        </div>

        <section class="collection" aria-label="Thư viện tài liệu">
          <div class="filter-bar">
            <nav class="menu" id="menuBar" aria-label="Lọc theo chuyên khoa"></nav>
            <div class="title-search">
              <span aria-hidden="true">⌕</span>
              <label class="sr-only" for="titleSearch">Tìm kiếm tài liệu</label>
              <input id="titleSearch" type="search" placeholder="Tìm theo tên bài, bệnh, năm…" autocomplete="off">
              <kbd>Ctrl K</kbd>
            </div>
          </div>
          <div class="filter-status">
            <button class="active-filter" id="activeFilter" type="button" hidden></button>
            <span class="result-count" id="resultCount"></span>
          </div>
          <div class="card-grid" id="cardGrid"></div>
          <div class="empty-state" id="emptyState" hidden>
            <strong>Không tìm thấy tài liệu phù hợp</strong>
            <p>Thử một từ khóa ngắn hơn hoặc bỏ bộ lọc chuyên khoa.</p>
          </div>
        </section>
      </section>

      <section class="reader-view" id="readerView" hidden aria-live="polite">
        <div class="reader-toolbar">
          <button class="back-button" id="backButton" type="button">← Thư viện</button>
          <div class="reader-title">
            <span id="readerCategory"></span>
            <strong id="readerTitle"></strong>
          </div>
          <a class="open-button" id="openButton" href="#" target="_blank" rel="noopener">Mở riêng ↗</a>
        </div>
        <iframe id="documentFrame" title="Nội dung hướng dẫn y khoa" allowfullscreen allow="fullscreen; autoplay; encrypted-media; picture-in-picture"></iframe>
      </section>
    </main>
  </div>

  <script src="app.js?v=20260923-1"></script>
